# 仓库体检 + 技能自检。
#
# 两个 job 分工明确（别把两者混为一谈）：
#   repo     —— tools/ci_check.py：语法 / JSON / 技能清单 / 依赖白名单 / 打包卫生 / 文档路径引用。
#               不需要 ffmpeg、字体、网络，任何平台都能跑，所以 Ubuntu + Windows 各跑一遍。
#   skill    —— skills/video-studio/scripts/selfcheck.py：24 条"曾经真的坏过"的回归断言。
#               需要 ffmpeg（含 libx264/aac/loudnorm）+ 中文字体；可选模块（sfxkit/scorekit/
#               webengine/qa_frames）缺失时自检会标 SKIP 而不是 FAIL，所以这里只装必需依赖。
#
# 不联网跑 TTS：selfcheck 只用合成信号与本地编码，不需要 edge-tts 真的合成。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: repo check
        run: python tools/ci_check.py -v

  skill:
    name: skill selfcheck (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg + CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow
      - name: selfcheck
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python selfcheck.py
      - name: 可选模块自检（缺依赖会失败，所以单独一步，失败信息更清楚）
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scorekit.py --selftest
          python qa_frames.py --selftest
