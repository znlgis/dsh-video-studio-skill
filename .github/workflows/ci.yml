# 仓库体检 + 技能自检。
#
# 两个 job 分工明确（别把两者混为一谈）：
#   repo     —— tools/ci_check.py 的 12 项（py/js 语法、JSON+版本一致性、技能清单、依赖白名单、
#               打包卫生、文档路径与相对链接、3.9 语法、Markdown 围栏、workflow 语法、单文件体积、
#               film.json 契约）。不需要 ffmpeg、字体、网络，任何平台都能跑，所以 Ubuntu + Windows 各跑一遍。
#   skill    —— skills/video-studio/scripts/selfcheck.py：67 条"曾经真的坏过"的回归断言（v1.0.2 起；
#               老文档里写的 43/51/55/58 都是历史版本的数，数 CASES 列表为准）。
#               需要 ffmpeg（含 libx264/aac/loudnorm）+ 中文字体；可选模块（sfxkit/scorekit/
#               webengine/qa_frames）缺失时自检会标 SKIP 而不是 FAIL，所以这里只装必需依赖。
#
# 为什么 skill 只在 Linux 跑：selfcheck 要 ffmpeg（libx264/aac/loudnorm）+ 中文字体，
# windows-latest 镜像是否预装这两样没有核实过（本机 Windows 能跑≠runner 能跑）；
# 与其押一个可能天天红的 job，不如先只跑 repo 检查。等核实（或改用 setup-ffmpeg + 字体下载）
# 之后再决定要不要补 Windows skill job——这条留给维护者决策，不是遗漏。
#
# 不联网跑 TTS：selfcheck 只用合成信号与本地编码，不需要 edge-tts 真的合成。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: repo check
        env:
          # 与 skill job 同口径：ci_check 会 spawn filmcheck.py 子进程，
          # 不设这个变量就会在 skills/video-studio/scripts/ 里留下 __pycache__，
          # 污染工作树（打包卫生那一项靠 .gitignore/npm 规则兜，没必要靠）
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_check.py -v

  skill:
    name: skill selfcheck (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg + CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow
      - name: selfcheck
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python selfcheck.py
      # 可选模块的 selftest 拆成独立 step：一个 step 里串三条 `set -e`，
      # 只看得出"这一坨失败了"，看不出是哪条——第一次跑 CI 就吃了这个亏。
      - name: 'selftest: sfxkit（24 配方 + 音质指标）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python sfxkit.py --selftest

      # scorekit 现在是**合成原语库**（混音/响度/确定性/24-bit 落盘），不再是"配乐模板引擎"：
      # v1.0.1 删掉了它的 9 套风格表（MUSIC_STYLES / render_styled），只留 legacy 逐样本兼容
      # 与可复用的合成原语。它仍被这套自检保护，所以这一步保留。
      - name: 'selftest: scorekit（合成原语 + legacy 逐样本兼容）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scorekit.py --selftest

      - name: 'selftest: qa_frames（帧级深检）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qa_frames.py --selftest

      # 兜底路径也要测：用户没装 scipy 时所有 IIR 走"分块 FFT 卷积"，
      # 那才是他们真正跑的代码。屏蔽 scipy 再跑一遍，断言按路径自适应
      # （见 sfxkit PERF_BUDGET_*）。
      - name: 'selftest: 无 scipy 兜底路径（用户常见配置）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/selftest_noscipy.py sfxkit scorekit