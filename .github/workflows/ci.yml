# 仓库体检 + 技能自检。
#
# 一共 5 个 job（开发机上的本地等价物见 README「仓库自检」一节）：
#   repo           —— tools/ci_check.py 的 15 项（py/js 语法、JSON+版本一致性、技能清单、
#                     依赖白名单、打包卫生、文档路径与相对链接、3.9 语法、Markdown 围栏、
#                     workflow 语法、单文件体积、film.json / footage.json 契约、断言条数一致）。
#                     不需要 ffmpeg、字体、网络，任何平台都能跑，所以 Ubuntu + Windows 各跑一遍
#                     （matrix 展开 = 2 个 runner）。
#   skill          —— skills/video-studio/scripts/selfcheck.py：92 条针对真实缺陷的回归断言
#                     （数为准的是 CASES 列表，不是文档里的任何数字）。
#                     需要 ffmpeg（含 libx264/aac/loudnorm）+ 中文字体；可选模块（sfxkit/scorekit/
#                     webengine/qa_frames）缺失时自检会标 SKIP 而不是 FAIL，所以这里只装必需依赖。
#   skill 里另有三个"整条产线"的自检：素材线 footage_selftest（F1–F8 全链路）、
#   hybrid 风格对齐 matchstyle_selftest（配色同族 + 左右黑带回归）、以及各模块 --selftest。
#   web            —— webengine.py --selftest：真起无头浏览器跑页面契约与逐帧截图。
#   py39           —— 独立 job（**不在 repo 的 matrix 里**）：让 ci_check 第 8 项「3.9 语法兼容」
#                     那条断言真的在 3.9 上执行过。
#   skill-windows  —— Windows 上的 selfcheck，advisory（continue-on-error，见文件末尾注释：
#                     连续绿几轮后转必过）。
#
# 平台覆盖小结：repo = Ubuntu + Windows；3.9 由 py39 单独覆盖；skill 自检跑 Linux（必过）+
# Windows（advisory）；web 只跑 Linux。
#
# 不联网跑 TTS：selfcheck 只用合成信号与本地编码，不需要 edge-tts 真的合成。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ruff 是**独立 step**，不进 ci_check 的检查表：ci_check 要能在裸机器（只装 python）
      # 上跑，而这条需要先装 ruff。分开的另一个好处是失败信息直指文件行号，
      # 不用在 14 项汇总里再拆一层。
      #
      # 为什么必须有这一步：pyproject.toml 从很早就配了 ruff（select = F,E9,B），
      # 但 CI 从来没跑过它——于是 F821（undefined name）这种"导入即崩"的缺陷
      # 一路跟着发布：tools/estimate.py 的 fallback 分支少一个 `import os`，
      # 只有 layoutkit 导入失败时才会踩到，属于"平时永远不跑"的路径。
      # 配置存在却不执行，比没有配置更糟：它让人以为已经查过了。
      - name: install ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.17.4"
      # ci_check 第 13 项（footage.json 契约）会 exec footagekit -> filmkit -> numpy + Pillow，
      # 并用 jsonschema 真校验 schemas/footage.schema.json 与两个真实样例。
      # v2.1.0 首次推送时这里没装依赖，于是两个平台的 repo check 一起红在"契约"上——
      # 看着像契约坏了，实际是"这台机器没装 numpy"。装上这些库，这一项才是真查；
      # 裸机器（只装 python）本地跑时它会记 SKIP 并打印缺哪个包，不会伪装成 PASS。
      #
      # 版本区间必须与 skills/video-studio/requirements.txt 一致：那条"上界"只有被 CI
      # 真的装上才验证得到；写同一个区间，等于 CI 跑的就是用户按 requirements 装出来的那套环境。
      - name: install ci_check deps (numpy/Pillow/jsonschema)
        run: pip install "numpy>=1.24,<3" "Pillow>=10.0,<14" "jsonschema>=4.0,<5"
      - name: lint (ruff)
        run: python -m ruff check . --output-format=github
      - name: repo check
        env:
          # 与 skill job 同口径：ci_check 会 spawn filmcheck.py 子进程，
          # 不设这个变量就会在 skills/video-studio/scripts/ 里留下 __pycache__，
          # 污染工作树（打包卫生那一项靠 .gitignore/npm 规则兜，没必要靠）
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_check.py -v

  skill:
    name: skill selfcheck (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg + CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      # apt 的 ffmpeg **不带 libvmaf**（Ubuntu 的 libavfilter 不依赖它），于是
      # qavmaf（G11 全片 VMAF 门禁）在 CI 上只能记 SKIP —— 那等于最重要的画质门禁
      # 又一次"配了但不执行"。这里额外装一份带 libvmaf 的静态构建并放到 PATH 最前。
      #
      # 兜底：下载失败**不算失败**（网络抖动不该让整个 job 红），后面的步骤会打印
      # libvmaf 能力探测结果；探测不到就是 SKIP，绝不会静默写成 pass。
      - name: install libvmaf-capable ffmpeg (static, optional)
        run: |
          set -u
          # 仓库已从 BtbN/FFmpeg-Builds 迁到 FFmpeg-Builds/FFmpeg-Builds（旧地址 301）。
          # 选 n8.1 的 gpl 静态构建：gpl 变体才有 libx264（filmkit 编码要用），
          # 而 vmaf 由 scripts.d/45-vmaf.sh 编译进所有变体（ffbuild_enabled 恒返回 0）。
          URL="https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          if curl -fsSL --retry 3 --connect-timeout 20 "$URL" -o /tmp/ff.tar.xz; then
            mkdir -p /tmp/ffbin && tar -xJf /tmp/ff.tar.xz -C /tmp/ffbin --strip-components=1 \
              && cp /tmp/ffbin/bin/ffmpeg /tmp/ffbin/bin/ffprobe /usr/local/bin/ \
              && rm -rf /tmp/ff.tar.xz /tmp/ffbin
            echo "静态 ffmpeg 已安装：$(command -v ffmpeg)"
          else
            echo "::warning::带 libvmaf 的静态 ffmpeg 下载失败；本 job 的 VMAF 检查会记 SKIP（不是 pass）"
          fi
      - name: report ffmpeg capabilities
        run: |
          ffmpeg -hide_banner -version | head -2
          if ffmpeg -hide_banner -filters 2>&1 | grep -qw libvmaf; then
            echo "libvmaf: available -> G11 VMAF 检查会真跑"
          else
            echo "::warning::libvmaf 不可用 -> G11 VMAF 检查记 SKIP（本 job 仍会绿，但覆盖不完整）"
          fi
      # 装齐"强烈建议"与可选依赖，而不是只装必需：
      # cv2 是"编码锐度比 ≥ 0.85"这条画质门禁的唯一实现，只装 numpy/Pillow 会让它
      # 整年在 CI 上走降级 WARN 分支——等于最重要的画质门禁从没被真跑过。
      # scipy 决定 sfxkit 走 IIR 还是 FFT 兜底（两条路径都要有覆盖，见下一步）。
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow opencv-python-headless scipy
      - name: selfcheck
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python selfcheck.py
      # 可选模块的 selftest 拆成独立 step：一个 step 里串三条 `set -e`，
      # 只看得出"这一坨失败了"，看不出是哪条——第一次跑 CI 就吃了这个亏。
      - name: 'selftest: sfxkit（24 配方 + 音质指标）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python sfxkit.py --selftest

      # scorekit 现在是**合成原语库**（混音/响度/确定性/24-bit 落盘），不再是"配乐模板引擎"：
      # 它不再是配乐引擎：只剩合成原语与 legacy 逐样本兼容路径
      # 与可复用的合成原语。它仍被这套自检保护，所以这一步保留。
      - name: 'selftest: scorekit（合成原语 + legacy 逐样本兼容）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scorekit.py --selftest

      - name: 'selftest: qa_frames（帧级深检）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qa_frames.py --selftest

      # ---- 下面四个模块各有 --selftest，以前一个都没进 CI --------------------
      # webengine 是 122 KB / 38 个开关的大模块，不进 CI 等于完全裸奔。
      # 它们都不联网；webengine 会真起无头浏览器，所以单独放到 web 那个 job 里跑。
      - name: 'selftest: musicgen（参数化配乐编排）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python musicgen.py --selftest

      - name: 'selftest: qaasr（ASR 回读判分逻辑，不加载模型）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qaasr.py --selftest

      - name: 'selftest: qavmaf（三档语义：没查不许写成通过）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qavmaf.py --selftest

      # G13 剪影可区分门禁的**实现本体**：tools/silhouette_qa.py 有 --selftest
      # （造 2 组设计现场验证判据，约 1 秒），但以前从没进过 CI——selfcheck 第 55 条
      # 只验"场景类型集合一致"，验不到这个工具本身的判据对不对。
      # 它跑在仓库根（要 import scripts/ 与 assets/），不需要 ffmpeg。
      - name: 'selftest: silhouette_qa（G13 剪影判据正/负控制）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/silhouette_qa.py --selftest

      # 素材线自检：自己合成一段带烧录字幕/水印的素材，跑 probe->tts->edl->cut->mix->assemble->qa
      # 与 F1–F8 判据。它要真调 ffmpeg，所以只能在这个 job 里跑；不跑的话，
      # 素材线的"门禁是不是真的在判"就没人验（selfcheck 第 70 条只查到产线路由）。
      - name: 'selftest: footage（素材线 F1–F8 全链路）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/footage_selftest.py

      # hybrid 风格对齐：合成一块已知色相的画面，断言量出来的色相、写进去的调色板、
      # 以及"素材段不被上色"这三件事。它守的是 2.5.0 那条方向性修复（素材保原色、
      # 图文段向素材看齐），不跑就等于回到"靠人眼记得"。
      - name: 'selftest: matchstyle（hybrid 风格对齐，含画幅左右黑带回归）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/matchstyle_selftest.py

      # 音频"同质化"的四组验收（A 跨片配乐 / B 跨片音效 / C 片内分离 / D 旁白优先）
      # 一直是**只读诊断工具**，从没在 CI 里按阈值判过。它 --strict 跑完约 4.5 秒，
      # 是这套"听起来差不多"类缺陷唯一可自动化的判据（阈值出处：
      # references/audio-variation.md §5）。
      - name: '验收: audio_similarity --strict（配乐/音效/旁白四组阈值）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/audio_similarity.py --strict

      # 兜底路径也要测：用户没装 scipy 时所有 IIR 走"分块 FFT 卷积"，
      # 那才是他们真正跑的代码。屏蔽 scipy 再跑一遍，断言按路径自适应
      # （见 sfxkit PERF_BUDGET_*）。
      - name: 'selftest: 无 scipy 兜底路径（用户常见配置）'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/selftest_noscipy.py sfxkit scorekit

  # 浏览器引擎单独一个 job：要下 chromium，慢且容易在网络层抖，
  # 不该拖累主 skill job 的反馈速度。
  web:
    name: webengine selftest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ffmpeg 必须显式装：新版 runner 镜像**不再预装** ffmpeg，而 webengine 的
      # 自检里有一条 image2pipe(PNG) -> libx264 的编码烟测。上一版 ubuntu-26.04
      # 上这条直接 FileNotFoundError: 'ffmpeg'（35 项里唯一的 FAIL）。
      - name: install deps + chromium + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install numpy Pillow playwright
          python -m playwright install --with-deps chromium
      - name: check ffmpeg
        run: ffmpeg -version | head -2
      - name: 'selftest: webengine（无头浏览器逐帧渲染）'
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python webengine.py --selftest

  # 3.9 语法断言（ci_check 第 8 项）以前没有任何 job 真正跑 3.9：
  # 断言的兼容性没人验证。这里用 3.9 真解释器跑仓库级体检，把"写了就没人试"补上。
  py39:
    name: python 3.9 compat (Linux)
    # **必须钉 22.04**：ubuntu-latest 已迁到 24.04/26.04，而 actions/setup-python
    # 在 22.04 之后不再提供 3.9 的预编译包（实测 26.04 报
    # "The version '3.9' ... was not found for Ubuntu 26.04"）。
    # 这一条从 v1.3.0 加进 CI 起就一直是红的，因为没人看得到"红的是环境还是代码"。
    # 3.9 的生命周期本身也快到期：这个 job 留着是为了让 ci_check 第 8 项的
    # "3.9 语法兼容"断言真的有人验证。等仓库决定不再支持 3.9 时，连这个 job 一起删。
    #
    # 与 repo job 的唯一差别：**不装 numpy/Pillow/jsonschema**（numpy 2.x 要求 >=3.10，钉 1.x
    # 又多一处版本漂移）。于是 ci_check 第 13 项（footage 契约）在这里记 SKIP —— 汇总里单独
    # 打印"跳过（缺 jsonschema，无法校验契约）"，不会写成 PASS；契约的真跑在 ubuntu/windows
    # 的 repo job（3.12）。第 12 项（film 契约）不需要三方依赖，照旧真跑。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: repo check on 3.9
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/ci_check.py -v

  # ---------------------------------------------------------------- 观察中的 Windows 回归
  # 为什么需要它：filmkit 有 `os.name == "nt"` 分支、字体表全是 C:\Windows\Fonts\*、
  # 子进程调用走 shell=True —— 这一整套"最可能坏"的路径以前从来没有回归。
  #
  # 为什么先挂 continue-on-error：windows-latest 是否预装 libx264/aac 的 ffmpeg、
  # 是否带 msyh 字体，**没有核实过**。与其押一个可能天天红的必过 job（红了就会被无视），
  # 不如先让它跑并出声。等它连续绿几轮，把下面这行删掉、转成必过。
  # —— 这不是遗漏，是一个有时间点的决定；写成注释是为了别让它永远"观察中"。
  skill-windows:
    name: skill selfcheck (Windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow opencv-python-headless
      - name: selfcheck
        working-directory: skills/video-studio/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python selfcheck.py